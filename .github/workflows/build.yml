
### Target Vendor/Product
CONFIG_VENDOR=ASUS
CONFIG_PRODUCT=MT7620

### Target ProductID
CONFIG_FIRMWARE_PRODUCT_ID="RT-N11P"

############################################################
### Linux kernel configuration
############################################################

### Стабильный разгон до 600MHz для работы NFQWS/VPN
CONFIG_FIRMWARE_CPU_600MHZ=y
CONFIG_FIRMWARE_CPU_SLEEP=n

### Лучший драйвер Wi-Fi для MT7620
CONFIG_FIRMWARE_WIFI2_DRIVER=3.0

### Сетевые функции (IPv6 и Ускоритель трафика SFE - ОБЯЗАТЕЛЬНО)
CONFIG_FIRMWARE_ENABLE_IPV6=y
CONFIG_FIRMWARE_INCLUDE_SHORTCUT_FE=y
CONFIG_FIRMWARE_INCLUDE_IPSET=y

### Отключаем лишние модули ядра для экономии RAM
CONFIG_FIRMWARE_INCLUDE_XFRM=n
CONFIG_FIRMWARE_INCLUDE_QOS=n
CONFIG_FIRMWARE_INCLUDE_IMQ=n
CONFIG_FIRMWARE_INCLUDE_IFB=n
CONFIG_FIRMWARE_INCLUDE_NFSC=n
CONFIG_FIRMWARE_INCLUDE_CIFS=n

############################################################
### Userspace configuration
############################################################

### Язык только Русский (экономим Flash)
CONFIG_FIRMWARE_INCLUDE_LANG_RU=y

### Базовые сервисы и безопасность
CONFIG_FIRMWARE_INCLUDE_DROPBEAR=y
CONFIG_FIRMWARE_INCLUDE_DROPBEAR_FAST_CODE=y
CONFIG_FIRMWARE_INCLUDE_HTTPS=y
CONFIG_FIRMWARE_INCLUDE_OPENSSL_EC=y
CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n

### Средства обхода блокировок (ОСТАВЛЕНО САМОЕ НУЖНОЕ)
CONFIG_FIRMWARE_INCLUDE_NFQWS=y
CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y
CONFIG_FIRMWARE_INCLUDE_AMNEZIAWG=y
CONFIG_FIRMWARE_INCLUDE_DOH=y
CONFIG_FIRMWARE_INCLUDE_CURL=y

### ОТКЛЮЧЕНО (избыточные DNS-сервисы для экономии 32MB RAM)
CONFIG_FIRMWARE_INCLUDE_DNSCRYPT=n
CONFIG_FIRMWARE_INCLUDE_STUBBY=n

### ОТКЛЮЧЕНО (тяжелые утилиты, не влезающие в лимит стабильности)
CONFIG_FIRMWARE_INCLUDE_TCPDUMP=n
CONFIG_FIRMWARE_INCLUDE_IPERF3=n
CONFIG_FIRMWARE_INCLUDE_SFTP=n
CONFIG_FIRMWARE_INCLUDE_NDISC6_RDISC6=n

### Системные оптимизации (ZRAM - СПАСЕНИЕ ДЛЯ 32MB RAM)
CONFIG_FIRMWARE_INCLUDE_ZRAM=y
CONFIG_CC_OPTIMIZE_FOR_SIZE=y

### Прочее (выключено)
CONFIG_FIRMWARE_INCLUDE_USBIP=n
CONFIG_FIRMWARE_INCLUDE_TOR=n
CONFIG_FIRMWARE_INCLUDE_PRIVOXY=n
CONFIG_FIRMWARE_INCLUDE_LUA=n
